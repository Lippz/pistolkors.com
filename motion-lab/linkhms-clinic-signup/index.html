<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkHMS · Clinic sign-up — motion draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&family=Roboto:wght@400&display=block" rel="stylesheet">
<link rel="stylesheet" href="../_lib/player.css">
<style>
  /*
   * LinkHMS · Clinic sign-up. Clinic Registration (Figma 151:13346) → Complete Your Clinic
   * Set Up (151:13383). Stage is the Figma frame size; all numbers are Figma pixels.
   */
  :root {
    --ink: #000;
    --ink-60: rgba(0, 0, 0, .6);
    --ink-42: rgba(0, 0, 0, .42);
    --line: rgba(0, 0, 0, .08);
    --blue: #3b69ff;
    --blue-50: #f0f3ff;
    --gray-hl: #d9dfe4;
    --shadow-box: 0 2px 4px rgba(0,0,0,.16), 0 4px 8px rgba(0,0,0,.08), 0 8px 12px rgba(0,0,0,.04);
    /* shadow/Frame: blur 12 / 48 / 64 */
    --shadow-frame: 0 8px 12px rgba(136,136,136,.08), 0 16px 48px rgba(136,136,136,.08), 0 32px 64px rgba(136,136,136,.08);
  }
  * { box-sizing: border-box; }
  .stage { background: #f5f5f5; font-family: Roboto, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .layer { position: absolute; inset: 0; }
  .bg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }

  /* ---------- Clinic Registration card (151:13382) ---------- */
  .card {
    position: absolute; left: 632px; top: 190px; width: 656px; height: 764px; padding: 48px;
    background: #fff; border-radius: 16px; display: flex; flex-direction: column; align-items: center; gap: 24px;
  }
  .card h1 { margin: 0; align-self: stretch; font-weight: 400; font-size: 34px; line-height: normal; letter-spacing: .25px; }
  .google {
    position: relative; overflow: hidden; width: 100%; height: 40px; padding: 8px 12px; border: 1px solid var(--blue); border-radius: 20px;
    display: flex; align-items: center; justify-content: space-between; font-size: 14px; line-height: 24px;
  }
  .google img, .google i { width: 20px; height: 20px; }
  .or { width: 100%; display: flex; align-items: center; gap: 12px; font-size: 14px; line-height: 20px; letter-spacing: .25px; color: var(--ink-42); }
  .or::before, .or::after { content: ''; flex: 1; height: 1px; background: #d9d9d9; }
  .inputs { width: 100%; display: flex; flex-direction: column; gap: 12px; }
  .line { display: flex; gap: 12px; }

  /* textfield_rectangle: 76 tall, box 52 with 5 above (label) and 19 below (helper) */
  .tf { position: relative; flex: 1 1 0; min-width: 0; height: 76px; }
  .tf__box { position: absolute; inset: 5px 0 19px 0; border-radius: 4px; border: 1px solid var(--line); background: #fff; }
  .tf__icon { position: absolute; right: 12px; top: 19px; width: 24px; height: 24px; }
  .tf__label {
    position: absolute; left: 6px; top: 0; padding: 0 4px; background: #fff;
    font-size: 10px; line-height: normal; letter-spacing: .4px; white-space: nowrap;
  }
  .tf__value {
    position: absolute; left: 10px; top: 21px; right: 46px; display: flex; align-items: flex-end;
    font-size: 14px; line-height: 20px; letter-spacing: .25px; white-space: nowrap;
  }
  .tf__text { overflow: hidden; }
  .tf__caret { flex: none; width: 1px; height: 18px; margin-bottom: 1px; background: var(--blue); }

  .tc { display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; letter-spacing: .25px; white-space: nowrap; }
  .tc a { color: var(--blue); }
  .check { position: relative; width: 24px; height: 24px; flex: none; }
  .check > * { position: absolute; inset: 0; }
  .btn-email {
    position: relative; overflow: hidden; width: 560px; height: 40px; border-radius: 24px; background: var(--blue);
    display: flex; align-items: center; justify-content: center;
    font-family: Manrope, sans-serif; font-weight: 700; font-size: 14px; line-height: 16px; letter-spacing: .75px; text-transform: uppercase; color: #fff;
  }
  .links { display: flex; gap: 4px; font-size: 14px; line-height: 20px; letter-spacing: .25px; white-space: nowrap; }
  .links a { color: var(--blue); }
  .ripple { position: absolute; border-radius: 50%; pointer-events: none; }

  /* ---------- Set up dashboard (151:13383): the Figma frame, with live parts on top ---------- */
  .part { position: absolute; inset: 0; }
  .patch { position: absolute; background: #fff; }
  .clinic { position: absolute; left: 56px; top: 37px; white-space: pre; font-size: 10px; line-height: 16px; letter-spacing: .4px; color: var(--ink-60); }

  /* Progress ends: Create Account (done at signup) and Clinic all set up */
  .pe { position: absolute; top: 510px; width: 120px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; white-space: nowrap; }
  .pe__dot { position: relative; width: 48px; height: 48px; border-radius: 24px; display: grid; place-items: center; }
  .pe__dot > * { grid-area: 1 / 1; }
  .pe__t { font-size: 16px; line-height: 24px; letter-spacing: .15px; }
  .pe__s { font-size: 12px; line-height: 16px; letter-spacing: .4px; color: var(--ink-60); }
  .lock { width: 48px; height: 48px; border-radius: 24px; border: 1px dashed var(--gray-hl); background: #f5f5f5; display: grid; place-items: center; }
  .trophy { width: 48px; height: 48px; border-radius: 24px; background: #1c63ed; display: grid; place-items: center; }
  .track { position: absolute; left: 256px; top: 554px; width: 1480px; height: 8px; border-radius: 8px; background: #f5f5f5; }
  .fill { position: absolute; left: 0; top: 0; height: 8px; border-radius: 8px; background: linear-gradient(90deg, #2bb01f, #1c63ed); }
  .tip {
    position: absolute; top: 510px; display: flex; flex-direction: column; align-items: center;
    filter: drop-shadow(0 2px 1px rgba(0,0,0,.14)) drop-shadow(0 3px 1px rgba(0,0,0,.12)) drop-shadow(0 1px 1.25px rgba(0,0,0,.2));
  }
  .tip span { position: relative; z-index: 2; margin-bottom: -22px; padding: 8px 16px; border-radius: 4px; background: #fff; font-size: 12px; line-height: 16px; letter-spacing: .4px; }
  .tip i { width: 28px; height: 28px; display: grid; place-items: center; }
  .tip i::before { content: ''; width: 19.8px; height: 19.8px; border-radius: 2px; background: #fff; transform: rotate(45deg); }

  /* Set-Up_Block: normal (151:13459…62) ↔ complete (163:37867…70), each with its hover */
  .sb { position: absolute; top: 630px; width: 429px; height: 140px; border: 1px solid var(--gray-hl); border-radius: 8px; background: #fff; }
  .sb__layer { position: absolute; inset: 0; padding: 23px 24px 25px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .sb__content { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .sb__title { display: flex; gap: 12px; font-size: 16px; line-height: 24px; letter-spacing: .15px; white-space: nowrap; }
  .sb__sub { font-size: 14px; line-height: 24px; color: var(--ink-60); white-space: nowrap; }
  .sb__btn {
    height: 24px; padding: 4px 12.5px; border-radius: 24px; display: flex; align-items: center; justify-content: center; gap: 8px;
    font-family: Manrope, sans-serif; font-weight: 500; font-size: 14px; line-height: 1.4; letter-spacing: .25px; white-space: nowrap;
  }
  .sb__ico { position: relative; width: 16px; height: 16px; flex: none; }
  .sb__ico img { position: absolute; inset: 0; width: 16px; height: 16px; }

  /* Cursor */
  .cursor { position: absolute; left: 0; top: 0; width: 19px; height: 24px; z-index: 20; transform-origin: 6px 1px; }
  .cursor img { width: 19px; height: 24px; display: block; }
  .click { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; border: 2px solid var(--blue); z-index: 19; pointer-events: none; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <!-- Screen 1: Clinic Registration. The frame's header and grey page, the card built live. -->
  <div class="layer" id="signup">
    <img class="bg" src="src/1-signup.png" alt="">
    <div class="patch" style="left:632px;top:190px;width:656px;height:764px;background:#f5f5f5"></div>
    <div class="card" id="card">
      <h1>Clinic Registration</h1>
      <div class="google"><img src="assets/google-g.svg" alt=""><span>Continue with Google</span><i></i></div>
      <div class="or">OR</div>
      <div class="inputs">
        <div class="line" data-fields="email password"></div>
        <div class="line" data-fields="name type"></div>
        <div class="line" data-fields="users role"></div>
        <div class="line" data-fields="country location"></div>
      </div>
      <div class="tc">
        <div class="check" id="check">
          <svg width="24" height="24" viewBox="0 0 24 24" id="checkOff"><rect x="4" y="4" width="16" height="16" rx="1" fill="none" stroke="rgba(0,0,0,.6)" stroke-width="2"/></svg>
          <img src="assets/checkbox-yes.svg" id="checkOn" alt="">
        </div>
        <span>By signing up, I agree to the LinkHMS <a>Terms &amp; Conditions</a>.</span>
      </div>
      <div class="btn-email" id="emailBtn">Continue With Email</div>
      <div class="links"><span>Already have an account?</span><a>Log in here</a></div>
    </div>
  </div>

  <!-- Screen 2: Complete Your Clinic Set Up. The Figma frame in parts so the cards can come in
       one by one; patches cover what moves (clinic name, the whole set up row under the banner). -->
  <div class="layer" id="dash">
    <div class="part" id="pSide" style="clip-path:inset(64px 1848px 0 0)"><img class="bg" src="src/2-setup.png" alt=""></div>
    <div class="part" id="pQuick" style="clip-path:inset(88px 24px 734px 96px)"><img class="bg" src="src/2-setup.png" alt=""></div>
    <div class="part" id="pSetup" style="clip-path:inset(358px 24px 286px 96px)">
      <img class="bg" src="src/2-setup.png" alt="">
      <!-- Everything under the trial banner is live -->
      <div class="patch" style="left:96px;top:496px;width:1800px;height:298px;border-radius:0 0 16px 16px"></div>
      <div class="pe" style="left:120px">
        <div class="pe__dot" id="done" style="background:#25c316"><img src="assets/accept.svg" width="24" height="24" alt=""></div>
        <div><div class="pe__t">Create Account</div><div class="pe__s">Done at signup</div></div>
      </div>
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="pe" style="left:1752px">
        <div class="pe__dot"><div class="lock"><img src="assets/lock.svg" width="24" height="24" alt=""></div><div class="trophy" id="trophy"><img src="assets/trophy.svg" width="24" height="24" alt=""></div></div>
        <div><div class="pe__t">Clinic all set up</div><div class="pe__s" id="togo">4 steps to go</div></div>
      </div>
      <div class="tip" id="tip"><span id="tipText">20%</span><i></i></div>
      <div id="blocks"></div>
    </div>
    <div class="part" id="pNext" style="clip-path:inset(806px 24px 0 96px)"><img class="bg" src="src/2-setup.png" alt=""></div>
    <div class="part" id="pHead" style="clip-path:inset(0 0 1016px 0)">
      <img class="bg" src="src/2-setup.png" alt="">
      <div class="patch" style="left:56px;top:38px;width:100px;height:14px"></div>
      <div class="clinic" id="clinic"></div>
    </div>
  </div>

  <div class="click" id="click"></div>
  <div class="cursor" id="cursor"><img src="assets/cursor-hand.png" alt=""></div>
</div>

<script src="../_lib/motion.js"></script>
<script src="../_lib/player.js"></script>
<script>
// ---------- Data ----------
// One clinic through the whole story: the name typed here is the one under the logo afterwards.
const CLINIC = 'Lekki Diagnostics';
const FIELDS = {
  email:    { label: 'Email *', value: 'ada.okafor@lekkidiagnostics.ng' },
  password: { label: 'Password *', value: '••••••••••••', icon: 'assets/eye-off.svg' },
  name:     { label: 'Clinic Name *', value: CLINIC },
  type:     { label: 'Clinic Type *', value: 'Diagnostics clinic', icon: 'assets/dropdown.svg' },
  users:    { label: 'Users in your clinic *', value: '6 to 15', icon: 'assets/dropdown.svg' },
  role:     { label: 'Your Role *', value: 'Administrator', icon: 'assets/dropdown.svg' },
  country:  { label: 'Country *', value: 'Nigeria', icon: 'assets/search.svg' },
  location: { label: 'Data Location *', value: 'South Africa', icon: 'assets/dropdown-2.svg' },
};

// ---------- Timeline (seconds) ----------
// Only Email and Clinic Name are typed; the rest of the form fills itself in.
const T = {
  cEmail: .75, tEmail: .9,
  fillPass: 1.95,     // password comes in like a saved one
  cName: 2.45, tName: 2.6,
  fillRest: 3.3,      // type, users, role, country, data location, one after another
  fillStep: .1,
  cCheck: 4.35,       // terms ticked: Continue With Email becomes active
  cGo: 4.95,
  out: 5.25,          // the card leaves
  dash: 5.5,          // the set up page comes in, card by card
  done: 6.2,          // Create Account ticks: the first 20%
  bar: 6.4,
  steps: [7.25, 8.05, 8.85, 9.65], // click Start Now on each block: +20% each
  trophy: 10.3,       // 100%: Clinic all set up
  loopOut: 12.0,
  end: 12.8,
};
const TYPE_STEP = 0.03;
const CLICKS = [T.cEmail, T.cName, T.cCheck, T.cGo, ...T.steps];
const REST = ['type', 'users', 'role', 'country', 'location'];

// [from, to, x, y]: each move ends just before the click it leads to.
const START = [1480, 880];
const MOVES = [
  [.2, T.cEmail - .1, 790, 445],               // Email
  [T.cName - .35, T.cName - .05, 790, 533],    // Clinic Name
  [T.cCheck - .5, T.cCheck - .05, 769, 786],   // the checkbox, once the form has filled in
  [T.cGo - .45, T.cGo - .05, 960, 842],        // Continue with email
  ...T.steps.map((at, i) => [at - (i ? .45 : .65), at - .05, 335 + 441 * i, 736]), // Start Now on each block
  [T.trophy - .2, T.trophy + .5, 1640, 870],   // off the blocks, so the finished row reads
  [T.loopOut, T.end - .05, ...START],
];

const $ = (id) => document.getElementById(id);

// ---------- Set up blocks ----------
// done: complete state from Figma 163:37843 (green, "Add More"; the subscription says "Completed").
const SETUP = [
  { icon: 'services', title: 'Set Up Services', sub: '0 Services added', doneSub: '1 Service added' },
  { icon: 'departments', title: 'Set Up Departments', sub: '0 Departments added', doneSub: '1 Department added' },
  { icon: 'staff', title: 'Add Clinic Staff', sub: '0 Users added', doneSub: '1 User added' },
  { icon: 'sub', title: 'Activate Subscription', sub: '3 trial days left', doneSub: '3 trial days left', doneBtn: 'Completed' },
];
const SB = SETUP.map((b, i) => {
  const el = document.createElement('div');
  el.className = 'sb';
  el.style.left = 120 + 441 * i + 'px';
  const blue = b.icon === 'sub' ? 'sub-icon' : b.icon + '-blue';
  const layer = (icon, sub, btn) => `<div class="sb__layer"><div class="sb__content">` +
    `<div class="sb__title"><img src="assets/${icon}.svg" width="24" height="24" alt="">${b.title}</div>` +
    `<div class="sb__sub">${sub}</div></div>${btn}</div>`;
  const ico = (a, w) => `<span class="sb__ico"><img src="assets/${a}.svg" alt=""><img class="w" src="assets/${w}.svg" alt=""></span>`;
  el.innerHTML =
    layer(blue, b.sub, `<div class="sb__btn" style="width:117px"><span>Start Now</span>${ico('arrow-blue', 'arrow-white')}</div>`) +
    layer(b.icon + '-green', b.doneSub, `<div class="sb__btn">${b.doneBtn ? ico('accept-green', 'accept') : ico('add-green', 'add-white')}<span>${b.doneBtn || 'Add More'}</span></div>`);
  $('blocks').appendChild(el);
  const [normal, done] = el.querySelectorAll('.sb__layer');
  return { el, normal, done, btns: el.querySelectorAll('.sb__btn'), whites: el.querySelectorAll('img.w') };
});

// ---------- Build fields ----------
const F = {};
for (const line of document.querySelectorAll('[data-fields]')) {
  for (const key of line.dataset.fields.split(' ')) {
    const d = FIELDS[key];
    const el = document.createElement('div');
    el.className = 'tf';
    el.innerHTML = `<div class="tf__box"></div>` +
      (d.icon ? `<img class="tf__icon" src="${d.icon}" alt="">` : '') +
      `<div class="tf__label">${d.label}</div>` +
      `<div class="tf__value"><span class="tf__text"></span><i class="tf__caret"></i></div>`;
    line.appendChild(el);
    F[key] = {
      el, d, box: el.querySelector('.tf__box'), label: el.querySelector('.tf__label'), icon: el.querySelector('.tf__icon'),
      value: el.querySelector('.tf__value'), text: el.querySelector('.tf__text'), caret: el.querySelector('.tf__caret'),
    };
  }
}

// float 0..1: label from inside the box (14px) up onto the border (10px). focus: dark 2px border.
// flash: blue tint when a value is filled in. show: value fades/raises in.
function setField(f, { float = 0, focus = false, text = '', caret = false, flash = 0, show = 1 }) {
  f.box.style.borderWidth = focus ? '2px' : '1px';
  f.box.style.borderColor = focus ? 'rgba(0,0,0,.42)' : 'rgba(0,0,0,.08)';
  f.box.style.background = `rgb(${[255, 255, 255].map((v, i) => Math.round(mix(v, [224, 232, 255][i], flash)))})`;
  const k = io(float);
  Object.assign(f.label.style, {
    top: mix(21, 0, k) + 'px', fontSize: mix(14, 10, k) + 'px',
    lineHeight: mix(20, 11.72, k) + 'px', letterSpacing: mix(.25, .4, k) + 'px',
    color: `rgba(0,0,0,${mix(.6, 1, k)})`,
  });
  f.text.textContent = text;
  f.value.style.opacity = show;
  f.value.style.transform = show < 1 ? `translateY(${(1 - show) * 6}px)` : '';
  f.caret.style.visibility = caret ? 'visible' : 'hidden';
}

const typed = (t, at, word) => word.slice(0, clamp(Math.floor((t - at) / TYPE_STEP) + 1, 0, word.length));
const blink = (t, since) => t < since || Math.floor((t - since) * 2) % 2 === 0;

// ---------- Helpers ----------
const cursorAt = cursorPath(START, MOVES);
const stage = $('stage');
const rect = (el) => {
  const s = stage.getBoundingClientRect(), r = el.getBoundingClientRect(), z = s.width / 1920;
  return { x: (r.left - s.left) / z, y: (r.top - s.top) / z, w: r.width / z, h: r.height / z };
};
const inside = (r, x, y) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;

function ripple(el, t, at, color) {
  let r = el.querySelector('.ripple');
  if (!r) { r = document.createElement('i'); r.className = 'ripple'; el.prepend(r); }
  const k = p(t, at, at + .5);
  const on = t >= at && k < 1;
  const w = el.offsetWidth * 1.2;
  Object.assign(r.style, {
    display: on ? 'block' : 'none', width: w + 'px', height: w + 'px',
    left: (el.offsetWidth - w) / 2 + 'px', top: (el.offsetHeight - w) / 2 + 'px',
    background: color, opacity: .35 * (1 - k), transform: `scale(${outC(k)})`,
  });
}

// ---------- Render ----------
function render(t) {
  // The form is out of sight once the set up page is in, so it can reset: at the loop it fades
  // back in empty, exactly as t = 0.
  renderForm(t >= T.dash + 1 ? 0 : t);
  renderDash(t);
}

function renderForm(t) {
  const [cx, cy] = cursorAt(t);

  // Typed fields: focus on click, type, keep the value.
  const typedField = (key, click, at, until) => {
    const focus = t >= click && t < until;
    const full = F[key].d.value;
    setField(F[key], {
      float: p(t, click, click + .18), focus,
      text: typed(t, at, full),
      caret: focus && blink(t, at + full.length * TYPE_STEP),
    });
  };
  typedField('email', T.cEmail, T.tEmail, T.fillPass);
  typedField('name', T.cName, T.tName, T.fillRest);

  // Filled in by the app: label lifts, value rises in, box blinks blue.
  const autofill = (key, at) => {
    const k = p(t, at, at + .25);
    setField(F[key], {
      float: k, text: t >= at ? F[key].d.value : '', show: outC(k),
      flash: t >= at ? 1 - p(t, at + .15, at + .9) : 0,
    });
  };
  autofill('password', T.fillPass);
  REST.forEach((key, i) => autofill(key, T.fillRest + i * T.fillStep));

  // Terms checkbox
  const ck = p(t, T.cCheck + .02, T.cCheck + .22);
  $('checkOn').style.opacity = ck;
  $('checkOn').style.transform = `scale(${mix(.6, 1, outBack(ck))})`;
  $('checkOff').style.opacity = 1 - ck;

  // Continue with email
  // Disabled (grey) until the terms are ticked, then it turns blue.
  const on = io(p(t, T.cCheck + .05, T.cCheck + .3));
  const overGo = on === 1 && inside(rect($('emailBtn')), cx, cy) && t < T.out;
  // Solid colours (12% / 38% black on the white card) so the change doesn't pass through a muddy grey-blue.
  const tone = (a, b) => `rgb(${a.map((v, i) => Math.round(mix(v, b[i], on)))})`;
  $('emailBtn').style.background = overGo ? '#2f5ae6' : tone([224, 224, 224], [59, 105, 255]);
  $('emailBtn').style.color = tone([158, 158, 158], [255, 255, 255]);
  ripple($('emailBtn'), t, T.cGo, '#fff');
}

function renderDash(t) {
  const [cx, cy] = cursorAt(t);

  // Screen change: the card lifts away, then the set up page's cards rise in one after another.
  // At the loop the page fades back to the empty form, which is where t = 0 starts.
  const out = io(p(t, T.out, T.out + .4));
  const back = io(p(t, T.loopOut, T.loopOut + .4));
  const cardBack = io(p(t, T.loopOut + .35, T.end - .05));
  const card = $('card');
  card.style.opacity = t < T.loopOut ? 1 - out : cardBack;
  card.style.transform = t < T.loopOut
    ? `translateY(${-16 * out}px) scale(${1 - .02 * out})`
    : `translateY(${12 * (1 - cardBack)}px)`;

  const dashIn = (at) => outQ(p(t, at, at + .55));
  $('dash').style.opacity = 1 - back;
  $('dash').style.display = t >= T.dash ? '' : 'none';
  $('pHead').style.opacity = dashIn(T.dash);
  $('pSide').style.opacity = dashIn(T.dash);
  [['pQuick', 0], ['pSetup', .1], ['pNext', .2]].forEach(([id, d]) => {
    const k = dashIn(T.dash + .05 + d);
    $(id).style.opacity = k;
    $(id).style.transform = `translateY(${(1 - k) * 28}px)`;
  });
  $('clinic').textContent = ' ' + CLINIC;

  // Create Account ticks and the bar runs to 20%; each Start Now click completes its block and adds 20%.
  const dk = p(t, T.done, T.done + .45);
  $('done').style.transform = `scale(${outBack(dk, 2)})`;
  $('done').style.opacity = clamp(dk * 3);
  const stepK = T.steps.map((at) => io(p(t, at + .1, at + .6)));
  const pct = 20 * io(p(t, T.bar, T.bar + .5)) + 20 * stepK.reduce((a, b) => a + b, 0);
  const w = 1480 * pct / 100;
  $('fill').style.width = w + 'px';
  $('fill').style.opacity = w > 1 ? 1 : 0;
  const tip = $('tip');
  tip.style.left = 256 + w - tip.offsetWidth / 2 + 'px';
  tip.style.opacity = clamp(p(t, T.bar, T.bar + .2));
  $('tipText').textContent = Math.round(pct) + '%';
  const left = 4 - T.steps.filter((at) => t >= at + .35).length;
  $('togo').textContent = left ? `${left} step${left > 1 ? 's' : ''} to go` : 'No steps to go';
  const tk = p(t, T.trophy, T.trophy + .45);
  $('trophy').style.opacity = clamp(tk * 3);
  $('trophy').style.transform = `scale(${outBack(tk, 2)})`;

  // Blocks: hover fades with the cursor over the last 0.14 s; the click turns the block complete.
  const lerp = (a, b, k) => a.map((v, i) => mix(v, b[i], k));
  const mixRgb = (a, b, k) => `rgb(${lerp(a, b, k).map(Math.round)})`;
  SB.forEach((b, i) => {
    const box = { x: 120 + 441 * i, y: 630, w: 429, h: 140 };
    let h = 0;
    for (let j = 0; j < 8; j++) {
      const s = t - .14 * j / 7;
      if (s >= T.dash && s < T.loopOut && inside(box, ...cursorAt(s))) h += 1 / 8;
    }
    const d = io(p(t, T.steps[i] + .05, T.steps[i] + .3));
    b.normal.style.opacity = 1 - d;
    b.done.style.opacity = d;
    // Border: grey → blue on hover; complete is green either way.
    b.el.style.borderColor = mixRgb(lerp([217, 223, 228], [59, 105, 255], h), [43, 176, 31], d);
    b.el.style.boxShadow = `0 8px 12px rgba(136,136,136,${.08 * h}), 0 16px 48px rgba(136,136,136,${.08 * h}), 0 32px 64px rgba(136,136,136,${.08 * h})`;
    // Start Now: blue-50 → blue. Add More: 16% green (on white) → green.
    b.btns[0].style.background = mixRgb([240, 243, 255], [59, 105, 255], h);
    b.btns[0].style.color = mixRgb([59, 105, 255], [255, 255, 255], h);
    b.btns[1].style.background = mixRgb([221, 241, 219], [43, 176, 31], h);
    b.btns[1].style.color = mixRgb([43, 176, 31], [255, 255, 255], h);
    b.whites.forEach((img) => { img.style.opacity = h; });
  });

  // Cursor + click ring
  const press = Math.max(...CLICKS.map((c) => bump(t, c, .18)));
  $('cursor').style.transform = `translate(${cx - 6}px, ${cy - 1}px) scale(${1 - .14 * press})`;
  const last = CLICKS.filter((c) => c <= t).pop();
  const rk = last === undefined ? 1 : p(t, last, last + .45);
  const ring = $('click');
  ring.style.display = rk < 1 ? '' : 'none';
  if (rk < 1) {
    ring.style.left = cx + 'px'; ring.style.top = cy + 'px';
    ring.style.opacity = .5 * (1 - rk);
    ring.style.transform = `scale(${mix(.3, 1, outC(rk))})`;
  }
}

// Everything above is timed in story seconds; SLOW stretches the whole loop evenly
// (cursor, typing, fades, pauses). 1 = the timeline as written.
const SLOW = 1.25;
const at = (t) => t * SLOW;
MotionPlayer.mount({
  stage, duration: at(T.end), render: (t) => render(t / SLOW),
  markers: [['email', T.cEmail], ['name', T.cName], ['fill', T.fillRest], ['terms', T.cCheck],
    ['continue', T.cGo], ['set up', T.dash], ['steps', T.steps[0]], ['100%', T.trophy], ['loop', T.loopOut]]
    .map(([name, t]) => [name, at(t)]),
  refs: [['Clinic Registration', 'src/1-signup.png'], ['Set up', 'src/2-setup.png']],
  poster: 0, // the first frame: the case shows it until the loop starts, so the start is seamless
});
</script>
</body>
