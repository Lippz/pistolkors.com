<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkHMS user flow — motion draft</title>
<link rel="stylesheet" href="../../_lib/player.css">
<style>
  /* Stage is the Figma frame (KK, page pp, frames "1"…"6", 153:27813 → 193:14915); numbers are Figma px. */
  * { box-sizing: border-box; }
  .stage { background: #f0f0f0; }
  #scene { position: absolute; left: 0; top: 0; overflow: visible; }
  .edge, .arrow, .short line, .short path { fill: none; stroke: #696969; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .pencil { fill: none; stroke: #4a4a4a; stroke-linecap: round; stroke-linejoin: round; }
  .pencil.a { stroke-width: 2.6; }
  .pencil.b { stroke-width: 1.4; opacity: .55; }
  .scribble { fill: none; stroke: #fff; stroke-width: 170; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <svg id="scene" width="2240" height="1260" viewBox="0 0 2240 1260" fill="none">
    <defs id="defs"></defs>
    <g id="wfs"></g>
    <!-- Flow frame sits at 131,33 in frames 1 and 6 (and 131,593 in 2–5: moved by `down`) -->
    <g id="flow" transform="translate(131 33)">
      <g id="short" class="short"></g>
      <g id="edges"></g>
      <g id="nodes"></g>
    </g>
  </svg>
</div>

<script src="../../_lib/motion.js"></script>
<script src="../../_lib/player.js"></script>
<script src="assets/flow.js"></script>
<script>
const SLOW = 1; // stretch every beat at once
const NS = 'http://www.w3.org/2000/svg';
const $ = (id) => document.getElementById(id);
const make = (tag, attrs = {}, parent) => {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
};

// ---------- Beats ----------
const WF = 3.8 * SLOW;           // one wireframe: sketch, fill, hold, leave
const T = {
  pills: .35 * SLOW,             // the four steps appear one by one
  step: .42 * SLOW,
  down: 2.9 * SLOW,              // the short flow drops to the bottom (frame 2)
  downEnd: 3.75 * SLOW,
  wf: 3.75 * SLOW,               // first wireframe starts
};
T.wfEnd = T.wf + 4 * WF;         // Records leaves
T.rise = T.wfEnd - .35 * SLOW;   // the steps take their places in the long flow
T.riseEnd = T.rise + 1.1 * SLOW;
T.grow = T.riseEnd - .2 * SLOW;  // the long flow grows out of them
// T.grown, T.fade and T.end are set once the growth is scheduled

// Wireframe beats, relative to its start
const SK = { sketch: 0, sketchDur: 1.05 * SLOW, fill: .75 * SLOW, fillDur: 1.0 * SLOW, clear: 1.6 * SLOW, clearDur: .5 * SLOW, out: WF - .55 * SLOW, outDur: .75 * SLOW }; // leaves to the left as the next one starts

// ---------- The four steps ----------
const SEEDS = ['15456', '15460', '15462', '15469'];           // Schedule, Patients, EMR, Records
const SHORT = SEEDS.map((_, i) => [509 + 260 * i, 567]);      // frame 1, flow-frame coords
const DOWN = 560;                                             // frames 2–5: the flow frame is 560 lower
const ACTIVE = { fill: [0xde, 0x7d], stroke: [0xb9, 0x00], text: [0x00, 0xff] }; // frame 2: #7d7d7d / #000 / white

// ---------- Nodes and edges of the long flow ----------
const nodeEls = {};
for (const id in NODES) {
  const n = NODES[id];
  const g = make('g', { 'data-id': id }, $('nodes'));
  g.innerHTML = n.svg;
  nodeEls[id] = { g, n, cx: n.x + n.w / 2, cy: n.y + n.h / 2, rects: g.querySelectorAll(':scope > rect'), text: g.querySelector(':scope > path') };
}

const edgeEls = EDGES.map((e) => {
  const g = make('g', {}, $('edges'));
  const path = make('path', { class: 'edge', d: e.d, pathLength: 1 }, g);
  const len = path.getTotalLength();
  const tip = path.getPointAtLength(len), back = path.getPointAtLength(len - 2);
  const a = Math.atan2(tip.y - back.y, tip.x - back.x), arm = 9;
  const pt = (s) => `${tip.x + arm * Math.cos(a + s * Math.PI * .75)} ${tip.y + arm * Math.sin(a + s * Math.PI * .75)}`;
  const arrow = make('path', { class: 'arrow', d: `M${pt(1)} L${tip.x} ${tip.y} L${pt(-1)}` }, g);
  let label = null;
  if (e.label) {
    label = make('g', {}, g);
    label.innerHTML = e.label;
    const b = label.getBBox();
    const knock = make('rect', { x: b.x - 5, y: b.y - 4, width: b.width + 10, height: b.height + 8, fill: '#f0f0f0' });
    label.prepend(knock);
  }
  return { ...e, g, path, arrow, label, len, tip };
});

// Growth: earliest time each node appears, spreading from the four steps along the connectors.
// An edge pointing away from a shown node draws first and the node pops at its tip;
// an edge pointing into a shown node waits for its source to pop, then draws into it.
const GAP = .1 * SLOW, POP = .4 * SLOW;
const edgeDur = (e) => clamp(e.len / 650, .32, .75) * SLOW;
const appear = {};
SEEDS.forEach((id) => (appear[id] = T.grow));
const edgeAt = {};
for (;;) {
  let best = null;
  for (const e of edgeEls) {
    const sIn = e.s in appear, eIn = e.e in appear;
    if (sIn === eIn) continue;
    // a node reached against an arrow waits about as long as one reached along it, so the wave stays even
    const at = sIn ? appear[e.s] + GAP + edgeDur(e) : appear[e.e] + GAP + edgeDur(e) * .8 + .1 * SLOW;
    if (!best || at < best.at) best = { e, at, node: sIn ? e.e : e.s };
  }
  if (!best) break;
  appear[best.node] = best.at;
}
for (const e of edgeEls) {
  const forward = appear[e.s] <= appear[e.e];
  // forward into the node it reveals, or after both ends are up (back edges, the seeds' own edges)
  edgeAt[e.id] = forward && Math.abs(appear[e.e] - (appear[e.s] + GAP + edgeDur(e))) < 1e-6
    ? appear[e.s] + GAP
    : Math.max(appear[e.s], appear[e.e]) + GAP + (SEEDS.includes(e.s) && SEEDS.includes(e.e) ? 0 : POP * .5);
}
T.grown = Math.max(...edgeEls.map((e) => edgeAt[e.id] + edgeDur(e)), ...Object.values(appear).map((a) => a + POP));
T.fade = T.grown + 3.2 * SLOW;
T.end = T.fade + 1.1 * SLOW;

// ---------- Short flow arrows (frame 1) ----------
const shortArrows = [0, 1, 2].map((i) => {
  const x1 = 692.5 + 260 * i, x2 = x1 + 73, y = 597;
  const g = make('g', {}, $('short'));
  const line = make('path', { d: `M${x1} ${y} L${x2} ${y}`, pathLength: 1 }, g);
  const head = make('path', { d: `M${x2 - 6.4} ${y - 6.4} L${x2} ${y} L${x2 - 6.4} ${y + 6.4}` }, g);
  return { line, head, x1, x2, y };
});
const dot = make('circle', { r: 6, fill: '#7d7d7d' }, $('short'));

// ---------- Wireframes ----------
// Sketch shapes in wireframe px (1920×1084 at 160,48): the outline drawn before the screen fills in.
function rng(seed) { let s = seed * 9301 + 49297; return () => ((s = (s * 9301 + 49297) % 233280) / 233280); }
function roughLine(x1, y1, x2, y2, r) {
  const len = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / len, uy = (y2 - y1) / len;
  const o1 = Math.min(12, len * .05) * (r() - .15), o2 = Math.min(12, len * .05) * (r() - .15);
  const ax = x1 - ux * o1, ay = y1 - uy * o1, bx = x2 + ux * o2, by = y2 + uy * o2;
  const bend = (r() - .5) * Math.min(16, 2 + len * .009);
  const mx = (ax + bx) / 2 - uy * bend, my = (ay + by) / 2 + ux * bend;
  return `M${ax.toFixed(1)} ${ay.toFixed(1)} Q${mx.toFixed(1)} ${my.toFixed(1)} ${bx.toFixed(1)} ${by.toFixed(1)}`;
}
// A word or a line of text, written as a loose cursive scrawl
function scrawl(x, y, w, h, r) {
  let d = `M${x} ${y + h * .6}`;
  const n = Math.max(3, Math.round(w / (h * .55)));
  for (let i = 1; i <= n; i++) {
    const px = x + (w * i) / n, up = i % 2 ? y + h * (.12 + r() * .15) : y + h * (.78 + r() * .12);
    d += ` Q${(px - w / n / 2).toFixed(1)} ${up.toFixed(1)} ${px.toFixed(1)} ${(y + h * (.5 + (r() - .5) * .2)).toFixed(1)}`;
  }
  return d;
}
const L = (x1, y1, x2, y2) => ['line', x1, y1, x2, y2];
const R = (x, y, w, h) => ['rect', x, y, w, h];
const W = (x, y, w, h) => ['word', x, y, w, h];
const frameShapes = (titleW) => [R(0, 0, 1920, 1084), L(0, 63, 1920, 63), L(28, 25, 46, 25), L(28, 32, 46, 32), L(28, 39, 46, 39), R(1877, 24, 14, 16), W(26, 94, titleW, 34)];
const rows = (x1, x2, y0, step, n) => Array.from({ length: n }, (_, k) => L(x1, y0 + step * k, x2, y0 + step * k));
const tabs = [R(24, 160, 1872, 47), L(492, 160, 492, 207), L(960, 160, 960, 207), L(1428, 160, 1428, 207)];
const card = (x, y) => [R(x, y, 924, 384), W(x + 26, y + 26, 200, 22), R(x + 25, y + 71, 874, 290), L(x + 25, y + 119, x + 899, y + 119)];
const WIRES = [
  { name: 'Schedule', src: 'assets/wf-schedule.png', shapes: [...frameShapes(141), R(1482, 88, 178, 48), R(1685, 88, 211, 48), R(24, 160, 1872, 898), L(24, 219, 1896, 219), L(239, 160, 239, 1058), ...rows(24, 1896, 279, 60, 13)] },
  { name: 'Patients', src: 'assets/wf-patients.png', shapes: [...frameShapes(126), ['circle', 1694, 110, 9], R(1731, 88, 165, 48), R(24, 160, 1872, 898), L(24, 207, 1896, 207), ...rows(24, 1896, 255, 48, 16), L(24, 997, 1896, 997)] },
  { name: 'EMR', src: 'assets/wf-emr.png', shapes: [...frameShapes(310), ...tabs, ...card(24, 232), ...card(972, 232), ...card(24, 640), ...card(972, 640)] },
  { name: 'Records', src: 'assets/wf-records.png', shapes: [...frameShapes(310), ...tabs, R(24, 232, 1872, 828), R(32, 240, 193, 39), ...[96, 132, 128, 96, 76, 82, 74, 98, 62, 92, 110, 74].map((w, k) => W(48, 296 + 48 * k, w, 18)), R(258, 256, 1613, 778), L(258, 303, 1871, 303), ...rows(258, 1871, 363, 60, 10), L(258, 973, 1871, 973)] },
];

const wfEls = WIRES.map((wf, i) => {
  const g = make('g', {}, $('wfs'));
  const mask = make('mask', { id: 'reveal' + i, maskUnits: 'userSpaceOnUse', x: 0, y: 0, width: 2240, height: 1260 }, $('defs'));
  make('rect', { x: 0, y: 0, width: 2240, height: 1260, fill: '#000' }, mask);
  // zigzag scribble, top-left to bottom-right, like shading a page in with a marker
  let d = 'M100 20', y = 20, left = false;
  const r0 = rng(i + 40);
  while (y < 1250) { y += 72; d += ` L${left ? 100 + r0() * 40 : 2140 - r0() * 40} ${y}`; left = !left; }
  const scrib = make('path', { class: 'scribble', d, pathLength: 1 }, mask);
  make('image', { href: wf.src, x: 160, y: 48, width: 1920, height: 1084, mask: `url(#reveal${i})` }, g);

  const sketch = make('g', { transform: 'translate(160 48)' }, g);
  const r = rng(i * 7 + 3);
  const strokes = [];
  for (const [kind, a, b, c, e] of wf.shapes) {
    const segs = [];
    if (kind === 'line') segs.push(roughLine(a, b, c, e, r));
    if (kind === 'rect') segs.push(roughLine(a, b, a + c, b, r), roughLine(a + c, b, a + c, b + e, r), roughLine(a + c, b + e, a, b + e, r), roughLine(a, b + e, a, b, r));
    if (kind === 'word') segs.push(scrawl(a, b, c, e, r));
    if (kind === 'circle') segs.push(`M${a + c} ${b} A${c} ${c} 0 1 1 ${a + c - .1} ${b - 2}`, `M${a + c * .7} ${b + c * .7} L${a + c * 1.6} ${b + c * 1.6}`);
    for (const sd of segs) {
      const pa = make('path', { class: 'pencil a', d: sd, pathLength: 1 }, sketch);
      // second, lighter pass a hair off the first (arcs keep their flags)
      const pb = make('path', { class: 'pencil b', d: sd.includes('A') ? sd : sd.replace(/-?\d+\.?\d*/g, (v) => (+v + (r() - .5) * 6).toFixed(1)), pathLength: 1 }, sketch);
      strokes.push({ pa, pb, len: pa.getTotalLength() });
    }
  }
  // each stroke gets a share of the sketch time by its length; they overlap like a quick hand
  const total = strokes.reduce((s, k) => s + Math.sqrt(k.len), 0);
  let acc = 0;
  for (const s of strokes) {
    s.at = (acc / total) * SK.sketchDur * .82;
    s.dur = Math.max(.1, (Math.sqrt(s.len) / total) * SK.sketchDur * 2.2);
    acc += Math.sqrt(s.len);
  }
  return { g, scrib, sketch, strokes, start: T.wf + i * WF };
});

// ---------- Render ----------
const hex2 = (a, b, k) => Math.round(mix(a, b, k)).toString(16).padStart(2, '0');
const grey = ([a, b], k) => '#' + hex2(a, b, k).repeat(3);
// Which step is lit: 0..3, fractional while it passes to the next one
function lit(t) {
  if (t < T.downEnd - .3 * SLOW) return [-1, outC(p(t, T.down + .5 * SLOW, T.downEnd))];
  for (let i = 0; i < 4; i++) {
    const s = T.wf + i * WF + SK.out;
    if (t < s + SK.outDur || i === 3) return [i, i === 3 ? 1 - p(t, T.rise, T.rise + .6 * SLOW) : 1, i < 3 ? io(p(t, s, s + SK.outDur)) : 0];
  }
}

function render(t) {
  const fadeAll = 1 - p(t, T.fade, T.fade + .8 * SLOW);

  // Steps: appear, drop, light up, rise into the long flow
  const down = io(p(t, T.down, T.downEnd));
  const rise = io(p(t, T.rise, T.riseEnd));
  const [cur, curK, passK] = lit(t);
  SEEDS.forEach((id, i) => {
    const ne = nodeEls[id];
    const k = outBack(p(t, T.pills + i * T.step, T.pills + i * T.step + .5 * SLOW), 1.2);
    const dx = (SHORT[i][0] - ne.n.x) * (1 - rise), dy = (SHORT[i][1] + DOWN * down - ne.n.y) * (1 - rise);
    const s = mix(.82, 1, k);
    ne.g.setAttribute('transform', `translate(${dx} ${dy}) translate(${ne.cx} ${ne.cy}) scale(${s}) translate(${-ne.cx} ${-ne.cy})`);
    ne.g.style.opacity = clamp(k * 1.6) * fadeAll;
    // lit: the current step, and the next one as the light passes along the arrow
    let on = 0;
    if (cur === -1) on = i === 0 ? curK : 0;
    else if (i === cur) on = curK * (1 - (passK || 0));
    else if (i === cur + 1) on = passK || 0;
    ne.rects[0].style.fill = grey(ACTIVE.fill, on);
    ne.rects[1].style.stroke = grey(ACTIVE.stroke, on);
    ne.text.style.fill = grey(ACTIVE.text, on);
  });

  // Short arrows: draw after their step, follow the drop, fade as the long flow takes over
  shortArrows.forEach((a, i) => {
    const k = io(p(t, T.pills + i * T.step + .28 * SLOW, T.pills + i * T.step + .62 * SLOW));
    a.line.style.strokeDasharray = '1 2';
    a.line.style.strokeDashoffset = 1 - k;
    a.head.style.opacity = p(k, .85, 1);
    a.line.parentNode.setAttribute('transform', `translate(0 ${DOWN * down * (1 - rise)})`);
    a.line.parentNode.style.opacity = 1 - p(t, T.rise, T.rise + .35 * SLOW);
  });
  // The light travels along the arrow to the next step
  if (cur >= 0 && cur < 3 && passK > 0 && passK < 1) {
    const a = shortArrows[cur];
    dot.setAttribute('cx', mix(a.x1 - 20, a.x2 + 20, passK));
    dot.setAttribute('cy', a.y + DOWN);
    dot.style.opacity = bump(passK, 0, 1);
  } else dot.style.opacity = 0;

  // Wireframes: pencil outline, the screen shaded in, the pencil lifts, the screen leaves
  wfEls.forEach((w) => {
    const lt = t - w.start;
    const visible = lt > -0.01 && lt < SK.out + SK.outDur + .01;
    w.g.style.display = visible ? '' : 'none';
    if (!visible) return;
    for (const s of w.strokes) {
      const k = outC(p(lt, s.at, s.at + s.dur));
      s.pa.style.strokeDasharray = s.pb.style.strokeDasharray = '1 2';
      s.pa.style.strokeDashoffset = 1 - k;
      s.pb.style.strokeDashoffset = 1 - p(k, .15, 1);
    }
    w.sketch.style.opacity = 1 - io(p(lt, SK.clear, SK.clear + SK.clearDur));
    w.scrib.style.strokeDasharray = '1 2';
    w.scrib.style.strokeDashoffset = 1 - io(p(lt, SK.fill, SK.fill + SK.fillDur));
    // slides off to the left, picking up speed
    const out = p(lt, SK.out, SK.out + SK.outDur);
    w.g.setAttribute('transform', `translate(${-2120 * out * out * (3 - 2 * out) * mix(.6, 1, out)} 0)`);
  });

  // Long flow: nodes pop, connectors draw from their source
  for (const id in nodeEls) {
    if (SEEDS.includes(id)) continue;
    const ne = nodeEls[id];
    const k = p(t, appear[id], appear[id] + POP);
    const s = mix(.55, 1, outBack(k, 1.5));
    ne.g.setAttribute('transform', `translate(${ne.cx} ${ne.cy}) scale(${s}) translate(${-ne.cx} ${-ne.cy})`);
    ne.g.style.opacity = clamp(k * 2.5) * fadeAll;
  }
  for (const e of edgeEls) {
    const k = io(p(t, edgeAt[e.id], edgeAt[e.id] + edgeDur(e)));
    e.path.style.strokeDasharray = '1 2';
    e.path.style.strokeDashoffset = 1 - k;
    e.path.style.opacity = k > 0 ? 1 : 0;
    e.arrow.style.opacity = p(k, .9, 1);
    if (e.label) e.label.style.opacity = p(k, .35, .6);
    e.g.style.opacity = fadeAll;
  }
}

const markers = [['flow', T.pills], ['Schedule', T.wf], ['Patients', T.wf + WF], ['EMR', T.wf + 2 * WF], ['Records', T.wf + 3 * WF], ['grow', T.grow], ['fade', T.fade]];
MotionPlayer.mount({
  stage: $('stage'), width: 2240, height: 1260, duration: T.end, render, markers,
  refs: [['1 · Flow', 'src/1-flow.png'], ['2 · Schedule', 'src/2-schedule.png'], ['3 · Patients', 'src/3-patients.png'], ['4 · EMR', 'src/4-emr.png'], ['5 · Records', 'src/5-records.png'], ['6 · Long flow', 'src/6-long-flow.png']],
  poster: 0, // first frame, so the case page doesn't jump from the poster to the start
});
</script>
</body>
</html>
