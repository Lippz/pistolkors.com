const vpill = (s) => {

const vacRows = VACCINES.map(([name, states], i) => {

const target = vacRows[TARGET].cells[3];

// ---------- Render ----------
// The screen up at t, the one before it, and when it came in.
function screenAt(t) {
  let i = SCREENS.length - 1;
  while (SCREENS[i][1] > t) i--;
  const [key, at] = SCREENS[i];
  // Before the first click the summary has been up since the end of the previous loop.
  const enteredAt = i === 0 ? SCREENS[SCREENS.length - 1][1] - T.end : at;
  return { key, at: enteredAt, prev: i > 0 ? SCREENS[i - 1][0] : null };
}

// Rows come in one after another each time a screen opens.
function enter(els, t, at, step = .03) {
  els.forEach((el, i) => {
    const k = outC(p(t, at + .08 + i * step, at + .42 + i * step));
    el.style.opacity = k;
    el.style.transform = `translateY(${(1 - k) * 8}px)`;
  });
}

// Record menu layout: open fraction per group, active item, hover under the cursor.
function renderTabs(t, top, active, cx, cy) {
  const close = io(p(t, T.cTreat, T.cTreat + .35)), reopen = io(p(t, T.cOver, T.cOver + .35));
  const open = [1 - close + reopen, 0, 0, close - reopen, 0, 0];
  let y = 44;
  groups.forEach((g, i) => {
    const full = 8 + 40 * (1 + g.subs.length);
    const gh = mix(48, full, open[i]);
    g.el.style.top = y + 'px';
    g.el.style.height = gh + 'px';
    if (g.chev) g.chev.style.transform = `rotate(${180 * open[i]}deg)`;
    const over = (top0, el) => {
      const ry = top + y + top0;
      el.style.opacity = cx >= 108 && cx <= 296 && cy >= ry && cy < ry + 40 ? 1 : 0;
    };
    over(4, g.hover);
    g.subs.forEach((s, j) => {
      s.el.style.opacity = clamp(open[i] * 1.6 - .3 - j * .08);
      s.el.classList.toggle('item--on', s.name === active);
      if (44 + 40 * j < gh) over(44 + 40 * j, s.hover); else s.hover.style.opacity = 0;
    });
    y += gh + 8;
  });
  const tabs = $('tabs');
  tabs.style.top = top + 'px';
  tabs.style.height = y - 8 + 12 + 'px';
}

const hoverRow = (el, x0, x1, y0, height, cx, cy, on) => {
  const over = on && cx >= x0 && cx <= x1 && cy >= y0 && cy < y0 + height;
  el.querySelector('.tr__hover').style.opacity = over ? 1 : 0;
  const open = el.querySelector('.open');
  if (open) open.style.opacity = over ? 1 : 0;
};

function render(t) {
  const { key, at, prev } = screenAt(t);
  const [cx, cy] = cursorAt(t);

  // Screens: the old one goes quickly, the new one fades in under its rows.
  ['sum', 'rec', 'drug', 'vac'].forEach((s) => {
    const k = s === key ? outC(p(t, at, at + .25)) : s === prev ? 1 - p(t, at, at + .12) : 0;
    $(s).style.opacity = k;
    $(s).style.display = k > 0 ? '' : 'none';
  });
  const settled = p(t, at, at + .25) === 1;

  // Breadcrumbs
  if ($('crumbs').dataset.key !== key) {
    $('crumbs').dataset.key = key;
    $('crumbs').innerHTML = ['Patients', PATIENT.short, ...CRUMBS[key]].map((c) => `<span>${c}</span>`).join('<img src="assets/bc-arrow.svg" alt="">');
  }

  renderTabs(t, 172, ACTIVE[key], cx, cy);

  if (key === 'sum') {
    enter(sumRows, t, at, .012);
    sumHover.forEach(({ el, x, y }) => hoverRow(el, x, x + 728, y, 48, cx, cy, settled));
  }
  if (key === 'rec') {
    enter(recRows, t, at);
    recRows.forEach((el, i) => hoverRow(el, 344, 1872, REC_ROW(i), 60, cx, cy, settled));
  }
  if (key === 'drug') {
    enter([...drugRows, logHead, sub], t, at, .05);
    const btn = drugRows[0].querySelector('.dose');
    const over = cx >= 1657 && cx <= 1791 && cy >= 401 && cy <= 437;
    btn.style.background = over ? '#e1e8ff' : '';
  }
  if (key === 'vac') {
    enter(vacRows.map((r) => r.name), t, at, .02);
    vacRows.forEach((r, i) => r.cells.forEach((c) => {
      const k = outC(p(t, at + .12 + i * .02, at + .5 + i * .02));
      c.style.opacity = k;
    }));
    // Hover on the overdue cell, then Vaccinate: the old pill shrinks away, Completed pops in.
    const overCell = Math.abs(cx - CELL[0]) < 152 && Math.abs(cy - CELL[1]) < 20 && t < T.cVaccinate;
    tOld.style.borderColor = overCell || (t >= T.cCell && t < T.cVaccinate) ? '#ed1c3f' : '';
    const k = p(t, T.cVaccinate + .05, T.cVaccinate + .45);
    tOld.style.opacity = 1 - clamp(k * 2.5);
    tOld.style.transform = `scale(${1 - .08 * outC(clamp(k * 2.5))})`;
    tNew.style.opacity = clamp(k * 2.5 - .5);
    tNew.style.transform = `scale(${mix(.85, 1, outBack(clamp(k * 1.6 - .25), 1.6))})`;
  }

  // Dropdown on the cell
  const mk = outQ(p(t, T.menu, T.menu + .22)) * (1 - p(t, T.cVaccinate + .05, T.cVaccinate + .2));
  const menu = $('menu');
  menu.style.display = mk > 0 ? '' : 'none';
  if (mk > 0) {
    menu.style.left = MENU_AT[0] + 'px';
    menu.style.top = MENU_AT[1] + 'px';
    menu.style.opacity = clamp(mk * 1.5);
    menu.style.transform = `scale(${mix(.94, 1, mk)})`;
    const y = cy - MENU_AT[1];
    const item = cx >= MENU_AT[0] && cx <= MENU_AT[0] + 167 && y >= 3 && y < 195 ? Math.floor((y - 3) / 48) : -1;
    $('menuBand').style.display = item < 0 ? 'none' : '';
    $('menuBand').style.top = 3 + item * 48 + 'px';
  }

  // Cursor + click ring
  const press = Math.max(...CLICKS.map((c) => bump(t, c, .18)));
  $('cursor').style.transform = `translate(${cx - 6}px, ${cy - 1}px) scale(${1 - .14 * press})`;
  const last = CLICKS.filter((c) => c <= t).pop();
  const ck = last === undefined ? 1 : p(t, last, last + .45);
  const ring = $('click');
  ring.style.display = ck < 1 ? '' : 'none';
  if (ck < 1) {
    ring.style.left = cx + 'px'; ring.style.top = cy + 'px';
    ring.style.opacity = .5 * (1 - ck);
    ring.style.transform = `scale(${mix(.3, 1, outC(ck))})`;
  }
}

MotionPlayer.mount({

  refs: [['Summary', 'src/1-summary.png'], ['Records', 'src/2-records.png'],
    ['Drug administration', 'src/3-drugs.png'], ['Vaccinations', 'src/4-vaccinations.png']],
  poster: 0, // the first frame: the case shows it until the loop starts, so the start is seamless
});
